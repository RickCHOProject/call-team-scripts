  }
  let h='<div class="sheetstep"><h3>'+esc(s.t)+'</h3><div class="goal"><b>Goal</b>'+esc(co.g)+'</div>'+body;
  if(coachOn)h+='<div class="coach"><div><b>Principle</b>'+esc(co.p)+'</div><div><b>Why it works</b>'+esc(co.w)+'</div><div><b>Tone</b>'+esc(co.t)+'</div><div><b>Advance when</b>'+esc(co.a)+'</div><div><b>Common mistake</b>'+esc(co.m)+'</div></div>';
  h+='</div>';
  return opt?'<details class="sheetoptional'+(['r_g2push','r_g4'].includes(id)?' offerobjection':'')+'"><summary>'+esc(opt)+'</summary>'+h+'</details>':h;
}
function sectionObjections(section,offer=false){
  const matches=(offer?OFFER_OB_MATCH:FIRST_OB_MATCH[lead])[section]||[],fl=flatOb();
  const rows=fl.map((o,i)=>({o,i})).filter(x=>matches.some(m=>x.o.q.includes(m)));
  if(!rows.length)return '';
  const allObjections=rows.every(x=>isObjectionResponse(x.o));
  return '<details class="optionalstack'+(allObjections?' objectionstack':'')+'"><summary>'+(allObjections?'Objection responses':'Questions &amp; objections')+' for this section ('+rows.length+')</summary><div class="optionalbody">'+rows.map(x=>'<div class="responseitem"><p class="q">If they say / ask: '+esc(x.o.q)+'</p>'+x.o.a.map(line).join('')+'</div>').join('')+'</div></details>';
}
// Offer Call: keep the normal conversation visible and each response one click away.
// New gap language is a CHO adaptation, not a quotation from Chris Voss.
const OFFER_GAP_RESPONSE=[
 ['s',`It sounds like we're a long way from what they expected.`],
 ['c',`Pause. Let the agent respond. Do not add commission or raise the offer to fill the silence.`]
];
const OFFER_WAIT_RESPONSE=[
 ['o',`Only if they already told you a problem or deadline`,`You mentioned [their stated problem or deadline]. What happens with that if they keep the property?`],
 ['c',`Listen. Use their answer to understand the options—not to scare them. If they can wait or have a better option, respect that.`],
 ['n',`Do not invent costs, deadlines, lost offers, or guarantees. A real payoff or price barrier may mean there is no workable deal.`]
];
OFFER_GAP_RESPONSE.forEach(L=>{if(L[0]==='s')objectionLines.add(L)});
OFFER_WAIT_RESPONSE.forEach(L=>{if(L[0]==='o')objectionLines.add(L)});
function offerDrawer(title,body,green=false){
  return '<details class="optionalstack offerresponse'+(green?' objectionstack':'')+'"><summary>'+esc(title)+'</summary><div class="optionalbody">'+body+'</div></details>';
}
function offerCard(title,body,id){
  let h='<div class="sheetstep offerstep"><h3>'+esc(title)+'</h3>'+body;
  if(coachOn&&id){const co=CO[ST[id].c];h+='<div class="coach"><div><b>Goal</b>'+esc(co.g)+'</div><div><b>Why it works</b>'+esc(co.w)+'</div><div><b>Common mistake</b>'+esc(co.m)+'</div></div>';}
  return h+'</div>';
}
function offerPart(id){return '<h4>'+esc(ST[id].t)+'</h4>'+ST[id].l.map(line).join('');}
function offerLines(rows,green=false){
  return rows.map(L=>{if(green&&(L[0]==='s'||L[0]==='o'))objectionLines.add(L);return line(L)}).join('');
}
function gateResponse(title,rows,green=false){return offerDrawer(title,offerLines(rows,green),green)}
function gateDone(text){return '<p class="offerhint"><b>Gate complete:</b> '+esc(text)+'</p>'}
function offerGroup(id){
  if(id==='offer-check'){
    return offerCard('Before dialing — not another discovery call',offerLines([
      ['c','Discovery and underwriting should already be finished. Confirm the approved offer and range.'],
      ['n','Do not make the offer when ALL FOUR are true:']
    ])+'<ul><li>Asking close to the fixed-up value.</li><li>Firm on that price.</li><li>No meaningful work needed.</li><li>No reason or urgency to sell at a discount.</li></ul>'+line(['n','A large price gap alone does not fail this check. If there is a possible deal, move to Gate 2.']))+
    gateResponse('If all four are true — keep the agent relationship',[
      ['s','I spoke to the underwriting team. This one isn’t really our criteria. We normally buy properties that need some work or where the seller needs a faster solution.'],
      ['s','Since you’re an agent in the area, do you have anything else that needs some work?'],
      ['c','Record exactly why it does not work. Podio: Lead Stage — Unqualified; Motivation — Cold; Next Action — Future Follow Up.']
    ])+gateDone('A possible deal moves to Gate 2, or the reason not to offer and future follow-up are recorded.');
  }
  if(id==='offer-number'){
    const a=ST.r_g3.l,alt=a.find(L=>L[0]==='o'),reconnect=ST.r_g1.l,process=ST.r_g2.l;
    const delivery=offerDrawer('Large gap — use this instead of the normal delivery',line(['n','Only after a great conversation, when the approved offer is far below their stated price. Read one version, not both.'])+line(alt)+line(a[a.length-1]));
    return offerCard('Reconnect',line(reconnect[0])+line(reconnect[1])+offerDrawer("If it's a bad time",line(reconnect[2]),true),'r_g1')+
      offerCard('Process review',line(process[0])+'<p class="offerhint">Read only the version that fits.</p>'+line(process[1])+line(process[2])+line(process[3]),'r_g2')+
      offerCard('Deliver the number',line(['n',"DON'T GIVE ANYTHING AWAY FOR FREE. No volunteered commission, higher price, or concessions. Deliver the approved offer and wait."])+delivery+a.filter(L=>L[0]!=='n'&&L[0]!=='o').map(line).join(''),'r_g3')+
      gateResponse('If the agent says “Too low,” “They won’t take it,” or “I already know their price”',ST.r_g2push.l,true)+
      gateResponse('If they ask “Is that your best offer?”',[
        ['s','That’s where the team landed based on the numbers. I know it may not be where the seller hoped, but go ahead and present it, and let’s see what they say.'],
        ['n','Do not reveal the ceiling, suggest room, or promise to come up.']
      ],true)+
      gateResponse('If the agent refuses to present it',[
        ['s','Is that your recommendation, or did the seller tell you not to present offers below a certain amount?'],
        ['o','Only if the seller gave instructions','Did the seller give you a lowest number they would consider?'],
        ['c','If it is only the agent’s recommendation, ask once more to present it. If they still refuse, send the offer for their records, document “Agent declined to present,” and stop active follow-up on this property. Do not log a seller rejection.']
      ],true)+
      gateResponse('If you need to understand the agent’s reaction',[
        ['s','Based on what you know about the seller, how do you think they’ll respond?'],
        ['n','This is a prediction, not a counter. It does not change our offer.']
      ])+
      offerCard('Send it & lock the clock',offerLines([
        ['n','Use only if the seller has not answered yet. If they have, go to Gate 3. Do not ask for a presentation time again if the agent already gave it—just set the callback.'],
        ['c','Send the offer in writing. A yes today is welcome, but the next step is getting it presented.'],
        ['s','When are you presenting it, and when should I call you back for the seller’s decision?'],
        ['s','Okay, I’ll call you back on [day] at [time] to hear what they decided.'],
        ['c','Save both times in Podio. If the seller has already accepted, go directly to Agreement & access.']
      ]))+gateDone('Offer sent, presentation confirmed, and exact callback set—or the agent’s refusal documented.');
  }
  if(id==='offer-answer'){
    return offerCard('After the offer has been presented',offerLines([
      ['n','Start here as soon as the seller has answered this offer—even during the same call. Use what the agent already told you. Do not repeat answered questions or ask them to present it again.'],
      ['s','What exactly did the seller say?'],
      ['n','Choose their actual answer below. “Thinking,” “more time,” “other offers,” “haven’t heard back,” and “I’ll get back to you” are not counteroffers.']
    ]))+
    gateResponse('Accepted — go straight to signatures',[
      ['s','Great. Let’s get the agreement signed while everyone is ready.'],
      ['c','Go to Agreement & access. Do not reopen price negotiations.']
    ])+
    gateResponse('Countered — confirm it came from the seller',[
      ['n','Only ask where the counter came from if that is still unclear. If the agent already confirmed it came from the seller, move to commitment.'],
      ['s','Did that counter come directly from the seller?'],
      ['o','If yes — test commitment, not a new offer','If we can get approval to improve the offer, will everyone sign?'],
      ['n','A firm yes can move to Gate 4. “I think so” or “Let me check” is not commitment—hold the offer and have the agent confirm. If the seller is firm but has not explained the number, use Gate 4 to learn what supports it.'],
      ['c','If it is the agent’s guess, keep the offer unchanged and get the seller’s actual answer.']
    ])+
    gateResponse('Rejected — find out what they said no to',[
      ['s','What exactly did the seller say no to? Did they give you a number or terms that would work?'],
      ['c','Identify the issue: price, closing date, inspection period, commission, possession, or another term. A specific issue or firm seller number goes to Gate 4. No current path goes to future follow-up.']
    ],true)+
    gateResponse('Still deciding — hold the offer & set a time',[
      ['s','Our offer stands. When will they be able to make their decision?'],
      ['c','Set an exact day and time. More time is not a reason to improve the offer. Honor the offer’s actual validity terms.']
    ])+
    gateResponse('If they mention higher offers',[
      ['s','Are those written offers the seller can accept now, or are they still being discussed?'],
      ['s','Besides price, how do the terms compare? Are they cash, and do they have financing, inspections, or other conditions?'],
      ['o','If the agent stays vague','Understood. Our offer is based on what works for us. Let me know what the seller decides.'],
      ['n','Do not bid against an unconfirmed offer.']
    ],true)+gateDone('Accepted, a real counter or issue, rejected with no path, or another exact decision time set.');
  }
  if(id==='offer-counters'){
    return line(['n','Open this gate only for a real seller counter, rejection with a number, specific objection, or new information. The agent disliking the offer is not enough. If the seller’s issue is already clear, use the matching response below—do not restart discovery or repeat the presentation story.'])+
      offerCard('1. Find the real issue',offerLines([
        ['s','Is it just the price, or is something else not working?'],
        ['c','Listen. Use only the response that fits. You may be able to fix a term without raising the price.']
      ]))+
      gateResponse('If another term is the problem',[
        ['s','If we solve that issue, does our price work?'],
        ['c','Confirm the specific term and get approval for any change. Do not offer extra concessions.']
      ],true)+
      gateResponse('2. If they are firm on price — what supports it?',[
        ['s','It sounds like the seller is pretty firm on that number. Help me understand what they’re looking at. Are there comps or upgrades that our underwriting team may have missed?'],
        ['s','If you can send me the recent solds or anything else supporting their number, I’ll have underwriting review it. I can’t promise it will change the offer, but it gives us something real to work with.'],
        ['c','Collect comps, photos, upgrades, repair details, or other evidence. Send it to underwriting; do not debate it on the call.'],
        ['n','No evidence—or evidence that does not support the number—means hold the offer. A desired price alone is not proof of value. If there is no path, record future follow-up.']
      ],true)+
      gateResponse('If the seller’s price is still far above ours — understand their plan',[
        ['s','It sounds like we’re a long way from what they expected.'],
        ['c','Pause. Ask the next question after they respond. This is not a reason to raise the offer.'],
        ['s','If they don’t get that price, what’s their plan for the property?'],
        ['o','If they plan to hold it','What does holding onto it mean for them in the meantime?'],
        ['o','If they want to test the market','How long do they want to try that before reviewing their options again?'],
        ...OFFER_WAIT_RESPONSE,
        ['c','If they want to revisit, agree on an exact day and time. Record their plan. Do not assume they will return in 30 days or promise today’s offer indefinitely; recheck with the team when they return.']
      ],true)+
      gateResponse('If the payoff or amount they need is above our offer',[
        ['s','Is that the amount they need to pay off what’s owed, or what they want to walk away with?'],
        ['c','Record what is confirmed and what is still an estimate. Take new information to the underwriting team. Do not promise to cover the gap; there may be no workable deal.']
      ],true)+
      gateResponse('If they worry the price will change after the walkthrough',[
        ['c',"Answer the price-change concern directly. Saying 'we buy as-is' does not answer it."],
        ['s',ST.r_frame.l[2][1]],
        ['n','Explain only approved inspection and price-change terms. Do not promise a fixed price or waive conditions without approval.']
      ],true)+
      gateResponse('3–5. Only if there is a reason to consider a change — commitment & approval',[
        ['n','A seller counter, new information, or commitment is a reason to review—not automatic approval to raise the offer. Never invent a higher number to restart the conversation.'],
        ['s','If we can get that approved, will everyone sign with everything else staying the same?'],
        ['c','If uncertain, stop here: hold the current offer and have the agent confirm with the seller.'],
        ['c','Get approval. Stay within the approved range. Anything above the ceiling goes back to underwriting. Promise nothing; keep the current offer until a new amount is approved.'],
        ['o','Only after approval','The team approved $[AMOUNT]. If that works, let’s get the agreement signed.'],
        ['n','If they counter again, repeat the process. Every move needs a reason and must bring the deal closer to signatures.']
      ])+
      gateResponse('If there is no workable deal today',[
        ['s','It sounds like we’re not lined up right now. When would it make sense to check back?'],
        ['c','Record why there is no path. Podio: Lead Stage — Offer Rejected; Motivation — Cold; Next Action — Future Follow Up. Record an agreed callback if there is one.']
      ])+gateDone('Signed agreement, current offer held with a clear next step, or no current path with future follow-up recorded.');
  }
  if(id==='offer-close'){
    const a=ST.r_lock.l;
    const core=a.filter(L=>L[0]!=='o').map(line).join('');
    return '<p class="offerhint">After they agree: confirm approval, contract details, and access.</p>'+
      offerCard('Lock it',core+offerDrawer('If they ask us to write it or need a faster closing',a.filter(L=>L[0]==='o').map(line).join('')),'r_lock')+
      offerCard('Confirm access & close',sheetLines(ST.r_agree.l),'r_agree')+
      gateResponse('After the offer — save the Podio record',[
        ['c','Record the offer amount and LOG; whether it was presented; any agent refusal; the seller’s actual answer; counter or objection; new evidence; signing commitment; reason for movement; and exact next action and follow-up time.']
      ])+
      offerDrawer('After signing — Day 2–3 check-in',ST.r_check.l.map(line).join(''));
  }
  return '';
}
function rFirstSheet(offer=false){
  const groups=offer?REALTOR_OFFER_FLOW:FIRST_FLOW[lead],open=lead==='seller'?sellerOpen():null;
  let h='<div class="bar2"><div class="seg">'+calls().map((x,i)=>'<button class="'+(i===ci?'on':'')+'" onclick="setCall('+i+')">'+x.n+'</button>').join('')+'</div>';
  h+='<label class="tog"><input type="checkbox" '+(coachOn?'checked':'')+' onchange="coachOn=this.checked;render()"> Show coaching</label></div>';
  h+='<div class="sheetnav"><div class="chips" style="margin:0">'+groups.map((g,i)=>'<button class="chip" onclick="document.getElementById(\'sheet-'+g.id+'\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">'+(offer?'':(i+1)+'. ')+esc(g.n)+'</button>').join('')+'</div></div>';
  h+='<main class="sheetmain"><div class="top"><span class="crumb">'+(offer?'Offer Call':'First Call')+' · Full call sheet</span><div>';
  if(lead==='seller')h+='<button class="ghost" onclick="cur=\'s_ch\';hist=[];render()">Change lead source</button>';
  h+='<button class="ghost" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">Top</button></div></div>';
  h+=offer?'<p class="sheetintro"><b>Never argue. Agent reaction is not seller rejection. No free movement.</b><br>Yellow: questions &amp; follow-ups. Green: objections. Use only what fits. If accepted, go straight to Agreement &amp; access.<br><a href="https://docs.google.com/document/d/137CsUJm0Yq4vMJjbvE9aacSOge-pqll0WhKieXkO5q0/edit" target="_blank" rel="noopener">Original Four Gates reference</a></p>':'<p class="sheetintro"><b>Stay in the conversation.</b> Move down the sheet naturally. Each section includes only the objections that fit that moment.</p>';
  groups.forEach((g,i)=>{
    h+='<section class="sheetgroup" id="sheet-'+g.id+'"><div class="sheethead"><h2>'+(offer?'':(i+1)+'. ')+esc(g.n)+'</h2></div>';
    if(offer)h+=offerGroup(g.id);
    else{
      if(g.note)h+=line(['n',g.note]);
      g.steps.forEach(([id,opt])=>{h+=sheetStep(id==='$open'?open:id,opt)});
      h+=sectionObjections(g.id);
    }
    h+='</section>';
  });
  h+='<div class="btns">'+(offer?'':'<button class="go rec" onclick="go(\'@offer\')">Go to Offer Call →</button>')+'<button class="go" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">Back to top</button></div>';
  h+='</main>';
  $('live').innerHTML=h;
}

function rLive(){
  if(C().k==='first'&&!(lead==='seller'&&cur==='s_ch'))return rFirstSheet();
  if(lead==='realtor'&&C().k==='offer')return rFirstSheet(true);
  const c=C(),s=ST[cur],co=CO[s.c],rt=isRT(cur);
  let h='<div class="bar2"><div class="seg">'+calls().map((x,i)=>'<button class="'+(i===ci?'on':'')+'" onclick="setCall('+i+')">'+x.n+'</button>').join('')+'</div>';
  h+='<label class="tog"><input type="checkbox" '+(coachOn?'checked':'')+' onchange="coachOn=this.checked;render()"> Show coaching</label></div>';
  h+='<div class="chips">'+c.p.map(([id,n])=>'<button class="chip '+((id===cur||id===s.a)?'on':'')+'" onclick="jump(\''+id+'\')">'+esc(n)+'</button>').join('')+'</div>';
  h+='<div class="cols"><main>';
  h+='<div class="top"><span class="crumb">'+esc(s.t)+'</span><div><button class="ghost" onclick="back()" '+(hist.length?'':'disabled')+'>← Back</button><button class="ghost" onclick="startCall();render()">Restart</button></div></div>';
  if(rt&&!s.brief)h+=briefSum();
  h+='<div class="goal"><b>Goal</b>'+esc(co.g)+'</div>';
  h+=cur==='r_agree'?sheetLines(s.l):s.l.map(line).join('');
  if(s.brief)h+=briefForm();
  if(coachOn)h+='<div class="coach"><div><b>Principle</b>'+esc(co.p)+'</div><div><b>Why it works</b>'+esc(co.w)+'</div><div><b>Tone</b>'+esc(co.t)+'</div><div><b>Advance when</b>'+esc(co.a)+'</div><div><b>Common mistake</b>'+esc(co.m)+'</div></div>';
  h+='<div class="btns">'+s.b.map(([l,to])=>'<button class="go" onclick="go(\''+to+'\')">'+esc(l)+'</button>').join('')+'</div>';
  h+='</main>'+objectionsPanel()+'</div>';
  $('live').innerHTML=h;
}

// ---------- TRAINING ----------
function deckCards(k){
  if(k==='obj')return OB[lead].flatMap(g=>g.i.map(o=>({f:(g.h?esc(g.h)+' · ':'')+esc(o.q),g:'',b:o.a})));
  const c=calls().find(x=>x.k===k);
  return c.p.filter(([id])=>!['s_ch','s_alt','rr_prep','sr_prep'].includes(id)).map(([id])=>{const s=ST[id],co=CO[s.c];return{f:c.n+' · '+esc(s.t),g:co.g,b:s.l.filter(x=>x[0]!=='c').concat([['n','Advance when: '+co.a]])}});
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startDeck(k){deck=k;tot=deckCards(k).length;pile=shuf([...Array(tot).keys()]);shown=false;render()}
function gotIt(){pile.shift();shown=false;render()}
function again(){pile.push(pile.shift());shown=false;render()}
function setSub(t){tsub=t;render()}
function pick(i){if(sans>-1)return;sans=i;sat++;if(i===SC[lead][si].r)sok++;render()}
function nextS(){si=(si+1)%SC[lead].length;sans=-1;render()}

function rTrain(){
  let h='<div class="bar2 wrap"><div class="seg">'+[['cards','Flashcards'],['scen','Scenarios'],['rules','Rules']].map(([k,n])=>'<button class="'+(k===tsub?'on':'')+'" onclick="setSub(\''+k+'\')">'+n+'</button>').join('')+'</div></div>';
  if(tsub==='cards'){
    if(!deck){deck='obj';tot=deckCards('obj').length;pile=shuf([...Array(tot).keys()]);shown=false}
    h+='<p class="note wrap"><b>How it works:</b> Pick a deck. Read the card and say your answer out loud. Click <b>Show answer</b> to check. Click <b>Got it</b> if you said it right, or <b>Practice again</b> and it comes back later.</p>';
    h+='<div class="bar2 wrap"><div class="seg">'+[['obj','Objections']].concat(calls().map(c=>[c.k,c.n])).map(([k,n])=>'<button class="'+(k===deck?'on':'')+'" onclick="startDeck(\''+k+'\')">'+n+'</button>').join('')+'</div></div>';
    h+='<div class="card wrap">';
    if(!pile.length){h+='<div class="done"><h3>Done — you got all '+tot+'.</h3><p style="color:var(--mut)">Run it again until you can say every answer without looking.</p><div class="btns" style="justify-content:center"><button class="go rec" onclick="startDeck(deck)">Start over</button></div></div>'}
    else{
      const c=deckCards(deck)[pile[0]],got=tot-pile.length;
      h+='<div class="count">'+pile.length+' left</div><div class="pbar"><div style="width:'+(got/tot*100)+'%"></div></div><div class="front">'+c.f+'</div>';
      if(c.g)h+='<div class="goal"><b>Goal</b>'+esc(c.g)+'</div>';
      if(!shown)h+='<p class="cue">Say it out loud first, then check.</p><div class="btns"><button class="go rec" onclick="shown=true;render()">Show answer</button></div>';
      else h+=c.b.map(line).join('')+'<div class="btns"><button class="go rec" onclick="gotIt()">Got it</button><button class="go" onclick="again()">Practice again</button></div>';
    }
    h+='</div>';
  }else if(tsub==='scen'){
    const s=SC[lead][si];
    h+='<div class="card wrap"><div class="top"><span class="crumb">'+esc(s.st)+'</span><span class="count">'+sok+' correct · '+sat+' attempted</span></div>';
    h+='<div class="scen">'+esc(s.x)+'</div><p style="font-weight:700;margin:0 0 10px">What\'s the right next move?</p>';
    h+=s.c.map((t,i)=>{let cl='choice';if(sans>-1){if(i===s.r)cl+=' right';else if(i===sans)cl+=' wrong'}return '<button class="'+cl+'" onclick="pick('+i+')">'+esc(t)+'</button>'}).join('');
    if(sans>-1)h+='<div class="fb"><b>'+(sans===s.r?'Correct. ':'Not quite. ')+'</b>'+esc(s.w)+'</div><div class="btns"><button class="go rec" onclick="nextS()">Next scenario →</button></div>';
    h+='</div>';
  }else{
    h+='<div class="card wrap"><div class="crumb" style="margin-bottom:8px">Rules of the game</div><ol class="rules">'+RU.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ol></div>';
  }
  $('train').innerHTML=h;
}

render();
</script>
