<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Closer Script</title>
<style>
:root{--y:#d8a600;--ybg:#fff8db;--opt:#d6b84b;--optbg:#fffdf1;--blue:#2563eb;--bluebg:#eff6ff;--g:#9aa0a6;--gbg:#f3f4f6;--ink:#1a1a1a;--mut:#666;--acc:#0f766e;--accbg:#ecfdf5}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f7f7f5;color:var(--ink)}
.app{max-width:1240px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:24px;margin:0}
nav{display:flex;background:#e9e9e6;border-radius:999px;padding:4px}
nav button{font:inherit;font-size:15px;font-weight:600;border:0;background:none;padding:8px 18px;border-radius:999px;cursor:pointer;color:#444}
nav button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;background:#e9e9e6;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;color:#555;cursor:pointer}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.big button{font-size:15px;padding:8px 16px}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#444;cursor:pointer;margin-left:auto}
.tog input{width:18px;height:18px;accent-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;color:#444}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.cols{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}aside{position:static!important;max-height:none!important}}
main,aside,.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px}
aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.crumb{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.goal{font-size:14px;color:#166534;background:var(--accbg);border-radius:8px;padding:8px 12px;margin:0 0 14px}
.goal b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
.say{font-size:20px;line-height:1.45;background:var(--ybg);border-left:5px solid var(--y);padding:12px 16px;border-radius:8px;margin:0 0 12px}
.say.opt{background:var(--optbg);border-color:var(--opt);font-size:17px}
.say.objection{background:#ecfdf5;border-color:#0f766e}
.type-objection{color:#0f5f57;background:#cceee1}
.tag{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:2px 0 4px}
.type{display:block;width:max-content;font-size:10px;line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;padding:4px 6px;border-radius:4px}
.type-say{color:#6b4f00;background:#ffe89a}
.type-opt{color:#695500;background:#f7e8a9}
.type-action{color:#1748a0;background:#dbeafe}
.type-note{color:#4b5563;background:#e5e7eb}
.cue{background:var(--bluebg);border-left:5px solid var(--blue);padding:10px 14px;border-radius:8px;color:#263c64;font-size:15px;margin:0 0 12px;line-height:1.4}
.note{background:var(--gbg);border-left:5px solid var(--g);padding:10px 14px;border-radius:8px;font-size:15px;color:#444;margin:0 0 12px;line-height:1.4}
.ph{color:#b45309;font-weight:600}
.coach{border:1px solid #dbe4f5;background:#f5f8ff;border-radius:10px;padding:10px 14px;margin:4px 0;font-size:14px;line-height:1.4}
.coach div{margin:6px 0}
.coach b{color:#315fd1;font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.go{font:inherit;font-size:16px;font-weight:600;padding:12px 18px;border-radius:10px;border:2px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer}
.go:hover,.go.rec{background:var(--acc);color:#fff}
.ghost{font:inherit;font-size:13px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:6px 10px;cursor:pointer;margin-left:6px}
.ghost:disabled{opacity:.4;cursor:default}
aside h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:#333}
.gh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--acc);margin:14px 0 4px}
.obs{display:flex;flex-direction:column;gap:6px}
.ob{font:inherit;font-size:15px;text-align:left;padding:9px 12px;border:1px solid #e0e0e0;border-radius:9px;background:#fafafa;cursor:pointer;color:var(--ink)}
.ob:hover{border-color:var(--acc)}
.ob.on{border-color:var(--acc);background:var(--accbg);font-weight:600}
.ans{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eee}
.ans .say{font-size:17px}
.ans .q{font-weight:700;font-size:15px;margin:0 0 8px}
.rulesbox{background:#fff5f5;border-left:5px solid #dc2626;border-radius:8px;padding:12px 16px;margin:0 0 12px}
.rulesbox ul{margin:6px 0 0;padding-left:20px;font-size:15px;line-height:1.5}
.brief{border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin:6px 0 4px;background:#fcfcfb}
.brief h3{margin:0 0 4px;font-size:16px}
.brief p{margin:0 0 10px;font-size:14px;color:var(--mut)}
.brief label{display:block;font-size:13px;font-weight:600;color:#333;margin:10px 0 4px}
.brief textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #d4d4d4;border-radius:8px;color:var(--ink);width:100%;min-height:110px;resize:vertical}
.brief textarea:focus,.brief select:focus{outline:2px solid var(--acc);border-color:transparent}
.brief select{font:inherit;font-size:15px;padding:7px 9px;border:1px solid #d4d4d4;border-radius:8px}
#cpOut{display:none;width:100%;min-height:160px;margin-top:8px;font:13px/1.4 ui-monospace,monospace;border:1px solid #d4d4d4;border-radius:8px;padding:8px}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;background:#f0f7f5;border:1px solid #cfe5df;border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.sum details{flex-basis:100%;font-size:14px}
.sum summary{cursor:pointer;color:var(--acc);font-weight:600}
.sum pre{white-space:pre-wrap;font-family:inherit;margin:6px 0 0;color:#333;max-height:260px;overflow:auto}
.legend{display:flex;justify-content:center;align-items:center;gap:8px 14px;flex-wrap:wrap;text-align:center;font-size:13px;color:var(--mut);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 4px 0 10px}
.wrap{max-width:780px;margin:0 auto 14px}
.front{font-size:23px;font-weight:700;margin:6px 0 10px;line-height:1.35}
.count{font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pbar{height:6px;background:#eee;border-radius:99px;overflow:hidden;margin:8px 0 16px}
.pbar div{height:100%;background:var(--acc);transition:width .25s}
.done{text-align:center;padding:20px 0}
.done h3{font-size:24px;margin:0 0 8px}
.scen{background:#f0f4f1;border-radius:12px;padding:15px 16px;font-size:18px;font-weight:600;margin:10px 0 14px;line-height:1.4}
.choice{display:block;width:100%;border:1px solid #e0e0e0;background:#fff;border-radius:10px;padding:12px 13px;text-align:left;cursor:pointer;font:inherit;font-size:16px;margin-bottom:8px;color:var(--ink)}
.choice:hover{border-color:var(--acc)}
.choice.right{border-color:#16a34a;background:#dcfce7}
.choice.wrong{border-color:#dc2626;background:#fee2e2}
.fb{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--gbg);font-size:15px}
.rules{margin:0;padding-left:22px}
.rules li{padding:9px 0;border-bottom:1px solid #eee;font-size:17px;line-height:1.4}
.rules li:last-child{border:0}
.sheetnav{position:sticky;top:0;z-index:5;background:rgba(247,247,245,.96);backdrop-filter:blur(8px);padding:8px 0;margin:-4px 0 12px}
.sheetintro{font-size:14px;color:#334155;background:#f8fafc;border:1px solid #dbe4ee;border-radius:9px;padding:9px 12px;margin:0 0 12px}
.sheetgroup{scroll-margin-top:72px;border-top:3px solid #d8e7e3;padding-top:14px;margin-top:20px}
.sheetgroup:first-child{margin-top:0}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sheethead h2{font-size:19px;margin:0;color:#164e4a}
.sheetstep{border:1px solid #e5e7eb;border-radius:11px;padding:14px;margin:0 0 12px;background:#fff}
.sheetstep h3{font-size:15px;margin:0 0 9px;color:#334155}
.sheetstep .goal{font-size:13px;padding:6px 9px;margin-bottom:9px}
.sheetstep .say{font-size:17px;padding:9px 12px;margin-bottom:8px}
.sheetstep .say.opt{font-size:16px}
.sheetstep .cue,.sheetstep .note{font-size:14px;padding:8px 11px;margin-bottom:8px}
.sheetstep .type{font-size:9px;margin-bottom:5px;padding:3px 5px}
.offerstep h3{font-size:17px;color:#164e4a}
.offerhint{font-size:14px;color:#475569;margin:0 0 10px;line-height:1.5}
.offerresponse{margin:0 0 10px}
.offerresponse .optionalbody{padding:12px}
.offerresponse .optionalbody h4{font-size:14px;color:#334155;margin:14px 0 8px}
.offerresponse .optionalbody h4:first-child{margin-top:0}
.optionalstack{border:1px solid #ead78a;background:#fffdf5;border-radius:9px;margin:0 0 8px}
.optionalstack summary{cursor:pointer;padding:10px 12px;font-size:13px;font-weight:800;color:#695500}
.optionalstack[open] summary{border-bottom:1px solid #eee2ae}
.optionalstack .optionalbody{padding:9px 10px 2px}
.optionalstack.objectionstack{border-color:#b8d8d1;background:#f4faf8}
.optionalstack.objectionstack>summary{color:#0f5f57}
.optionalstack.objectionstack[open]>summary{border-color:#cfe5df}
.responseitem{margin-bottom:12px}
.responseitem .q{font-size:14px;font-weight:700;margin:0 0 8px}
.sheetoptional{border:1px dashed #cbd5e1;border-radius:10px;margin:0 0 12px;background:#fafafa}
.sheetoptional summary{cursor:pointer;padding:10px 13px;font-size:14px;font-weight:700;color:#475569}
.sheetoptional .sheetstep{border:0;border-top:1px dashed #cbd5e1;border-radius:0;margin:0;background:#fff}
.sheetoptional.offerobjection{border-color:#add8d2;background:#f0faf7}
.sheetoptional.offerobjection summary{color:#0f766e}
.sheetmain{width:100%;max-width:960px;margin:0 auto}
.sectionobs{border:1px solid #cfe5df;background:#f4faf8;border-radius:11px;padding:12px 14px;margin:14px 0 4px}
.sectionobs h3{font-size:14px;margin:0 0 3px;color:#0f5f57}
.sectionobs>p{font-size:12px;color:var(--mut);margin:0 0 9px}
.sectionobs .obs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:7px}
.sectionobs .ob{background:#fff;font-size:14px;padding:8px 10px}
.sectionobs .ans{background:#fff;border:1px solid #b8d8d1;border-radius:9px;padding:11px;margin:0 0 10px}
.sectionobs .ans .say{font-size:16px}
.anshead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.anshead .q{margin:0}
@media(max-width:700px){.sheetnav .chip{font-size:12px;padding:5px 9px}.sheetstep{padding:11px}.sheetstep .say{font-size:16px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Closer Script</h1>
    <nav>
      <button id="mLive" class="on" onclick="setMode('live')">Live Call</button>
      <button id="mTrain" onclick="setMode('train')">Training</button>
    </nav>
  </header>
  <div class="bar2"><div class="seg big" id="leadSeg"></div></div>
  <section id="live"></section>
  <section id="train" hidden></section>
  <div class="legend"><span><i style="background:var(--y)"></i>Say / ask</span><span><i style="background:var(--opt)"></i>Follow-up when needed</span><span><i style="background:var(--acc)"></i>Objection response</span><span><i style="background:var(--blue)"></i>Action</span><span><i style="background:var(--g)"></i>Note</span><span>[brackets] = fill in</span></div>
</div>

<script>
// ---------- COACHING ----------
const CO={
open:{g:`Make sure they have time to talk.`,p:`Reactance · Pattern interrupt`,w:`People resist when they feel pushed. A small, easy choice lowers that resistance. "Bad time?" breaks the usual sales-call pattern.`,t:`Positive and playful. Sound glad to talk to them.`,a:`They agree to talk now or give a specific callback time.`,m:`Starting discovery while they're distracted.`},
exp:{g:`Explain how the call works and get a clear yes-or-no agreement.`,p:`Upfront contract`,w:`Setting the agenda and asking for a straight answer up front makes it easier to get a real answer at the offer.`,t:`Relaxed and upfront.`,a:`They agree to give you a straight yes or no.`,m:`Skipping it and getting "let me think about it" at the offer.`},
sit:{g:`Find the seller's main problem and show the agent you understand it.`,p:`Tactical empathy · Labeling · Mirroring`,w:`Listen for the main problem. Ask only what helps you understand it, then repeat it back in a few words.`,t:`Stay curious. Give them time to answer.`,a:`You know the seller's main problem and what they will do if the offer does not work.`,m:`Reading every question or moving on before you understand the problem.`},
ssit:{g:`Learn what is going on with the property and the seller.`,p:`Tactical empathy · Active listening`,w:`Let the seller explain the situation first. Then ask about the details that matter.`,t:`Stay curious. Give them time to answer.`,a:`You understand the property situation and know what to ask next.`,m:`Interrupting or guessing what the problem is.`},
dec:{g:`Know who decides and who can sign.`,p:`Commitment and consistency`,w:`People are more likely to complete a step they clearly agreed to in advance. Everyone on title has to sign.`,t:`Direct, neutral, matter-of-fact.`,a:`You know who's on title, who decides, and that they're on board.`,m:`Assuming one person can accept or sign for everyone.`},
cond:{g:`Get clear property facts and ask for photos.`,p:`Priming · Specificity`,w:`Specific questions make them think through the systems and condition before the number comes up. It also gets them in "answering mode."`,t:`Curious, steady, detailed. Not accusatory.`,a:`Condition, systems, updates, risks, and photo status are documented.`,m:`Guessing repairs or promising a number from incomplete information.`},
mot:{g:`Find the main reason they need to sell and what happens if they do not.`,p:`Tactical empathy`,w:`Their reason for selling tells you what matters most to them. You will need it when you discuss the offer.`,t:`Let them talk. Write down the main problem.`,a:`You know why they want to sell, how long it has been happening, and what happens if they do not sell.`,m:`Moving on after a short answer.`},
urg:{g:`Learn who makes the decision and how the seller will review the offer.`,p:`Commitment and consistency`,w:`Knowing the decision process helps you get the offer in front of everyone who needs to see it.`,t:`Matter-of-fact.`,a:`You know who decides, who else is involved, and how the offer will be reviewed.`,m:`Skipping the decision process or treating it like an optional question.`},
owe:{g:`Find out what is owed so you know whether a cash offer can work.`,p:`Specificity`,w:`Their payoff sets the floor. Without it you can't tell if the deal can work or if they're underwater.`,t:`Matter-of-fact. This is a normal question.`,a:`You know the rough payoff, whether they're current, and any auction date.`,m:`Skipping it and making an offer that can't cover their payoff.`},
time:{g:`Find out when they want to close and why.`,p:`Gain framing · Loss framing`,w:`Gain framing shows the benefit of certainty. Loss framing shows the cost of waiting, but only when the facts support it.`,t:`Calm and neutral. Don't manufacture urgency.`,a:`You know the closing window and whether it's flexible.`,m:`Creating fake urgency or overstating consequences.`},
price:{g:`Get their price without agreeing, arguing, or reacting.`,p:`Anchoring awareness · Third-party authority`,w:`Notice their number without agreeing to it. If they hold it back, use underwriting as the outside authority and explain why even a ballpark saves both sides time. Ask once more, then move on without pressure.`,t:`Flat and neutral. No surprise in your voice.`,a:`You have their number—or a documented refusal after one clean second attempt—plus enough facts to underwrite.`,m:`Reacting, arguing, making an offer during discovery, or repeatedly pressing for a number.`},
frame:{g:`Explain the process before you talk about the offer.`,p:`Upfront contract · Pre-frame`,w:`Explaining the process before the number makes it feel safer. The "we work through it together" line plants the seed for a retrade, so it's not a surprise later.`,t:`Clear, confident, calm.`,a:`They understand the process and agree it's reasonable.`,m:`Making promises the company can't guarantee.`},
end1:{g:`Set the exact day and time for the next call.`,p:`Commitment and consistency`,w:`An exact time turns "I'll get back to you" into a commitment.`,t:`Positive and specific.`,a:`Exact callback day and time set. Podio updated.`,m:`Leaving the follow-up open-ended.`},
g1:{g:`Offer only when the lead passes the underwriting filter.`,p:`Decision discipline`,w:`This is an operating gate, not a persuasion tactic.`,t:`Internal. Use evidence, not emotion.`,a:`There's a possible deal and an approved opening offer and range.`,m:`Forcing a bad offer to hit the daily offer standard.`},
g2:{g:`Deliver the approved number, get it presented, lock the follow-up.`,p:`Anchoring · Middle-man positioning · Silence`,w:`Underwriting is the authority, you're the messenger. The approved number becomes the reference point. Extra talking weakens it.`,t:`Late-night FM DJ voice. Calm, slow, downward inflection.`,a:`Offer sent, presentation confirmed, follow-up scheduled, or refusal documented.`,m:`Defending the number, filling silence, or moving because of a reaction.`},
g3:{g:`Get the seller's real answer.`,p:`Commitment and consistency`,w:`A clear answer creates the next correct action. "I think" and "they need time" don't open negotiation.`,t:`Calm, exact, non-defensive.`,a:`Accepted, countered, rejected with no path, a specific issue, or another exact decision time.`,m:`Treating the agent's prediction or "they're thinking" as a counteroffer.`},
g4:{g:`Work a real rejection or counter without giving away movement.`,p:`Loss aversion · Trade, don't give`,w:`First make the real alternative clear. If CHO moves on price or terms, get a signing commitment in return.`,t:`Direct and steady. No excitement about increasing price.`,a:`Agreement ready to sign, offer held with a clear next step, or no current path.`,m:`Inventing urgency, giving a free concession, or promising an unapproved number.`},
anchor:{g:`Prepare them for the number, deliver it, and stop talking.`,p:`Anchoring · Tactical empathy · Silence`,w:`Preparing them softens the reaction. Silence after the number makes them respond first. If you keep talking, you negotiate against yourself.`,t:`Late-night FM DJ voice. Slow, calm, downward inflection. No uptalk.`,a:`They respond to the number.`,m:`Filling the silence or apologizing for the number.`},
push:{g:`Get their number and a commitment before going back to underwriting.`,p:`Trade, don't give · Middle-man positioning`,w:`You're not the decision maker, so you never negotiate live. Get their number and a yes first.`,t:`On their side. Late-night FM DJ voice.`,a:`You have their number and a yes to moving forward if it's approved.`,m:`Moving on price during the call.`},
alt:{g:`Pick the right way to stay in the deal when cash doesn't work.`,p:`Decision discipline`,w:`Time & Access keeps the same energy as a cash deal. The premium option is a separate pitch.`,t:`Internal decision.`,a:`You've picked the path that fits this seller.`,m:`Walking away from a seller whose price could work with a buyer.`},
ta:{g:`Lock at their price with the same energy as a cash deal.`,p:`Consistency · No Plan B`,w:`Saying yes to their number with no backup pitch keeps trust. You close with them first, then find your buyer.`,t:`Same energy as a cash deal. Calm, no hesitation.`,a:`They agree, and you move straight to the agreement.`,m:`Pitching it like a backup plan or over-explaining.`},
prem:{g:`Keep the deal alive when cash doesn't work.`,p:`Social proof (only if true)`,w:`When the cash number doesn't work, this keeps you in the deal.`,t:`Helpful, no pressure.`,a:`Agreement sent, or they decline.`,m:`Using stats or stories that aren't real.`},
agree:{g:`Turn the yes into signatures and a complete Podio record.`,p:`Commitment and consistency`,w:`A verbal yes can drift unless the signing action and time are specific.`,t:`Positive, clear, fast to action.`,a:`Agreement signed or exact signing time set. Podio complete.`,m:`Treating a verbal yes as a signed contract.`},
follow:{g:`Get a real answer on the offer.`,p:`Go for No · Boxing`,w:`"Still thinking" is usually a polite no. Going for no gets you the real objection so you can work it.`,t:`Calm and friendly. No pressure.`,a:`A yes, a real objection to work, a clear no, or an exact next time.`,m:`Accepting "still thinking" and hanging up.`},
check:{g:`Keep the seller engaged and on track after signing.`,p:`Commitment and consistency`,w:`Sellers go quiet and second-guess after signing. Regular contact keeps the deal alive and gives them a good experience.`,t:`Positive and easy.`,a:`Photos received, walkthrough scheduled, no surprises.`,m:`Going silent until closing.`},
rprep:{g:`Build this deal's retrade script before you dial.`,p:`Never freestyle`,w:`Every retrade follows the framework. The AI reads the dispo brief and the calls, then writes the script for this exact deal and person.`,t:`Internal.`,a:`You know dispo's ceiling and have chosen your number below it.`,m:`Calling without knowing where we're at, or freestyling the conversation.`},
radv:{g:`Open as the person who fought for the deal.`,p:`#1 Advocate · Tactical empathy · Unity`,w:`You're delivering news from your team, not making a personal demand. It's you and them against the numbers.`,t:`Late-night FM DJ voice. Calm, not apologetic.`,a:`They know news is coming and that you fought for them.`,m:`Saying "We need you to come down."`},
rfind:{g:`Walk through what changed, one piece at a time.`,p:`Specificity · Honesty`,w:`Findings are the reason for the number. New findings can't be argued. Scope findings need different language so they don't feel accused of hiding it.`,t:`Slow. Pause between each finding.`,a:`They've heard every finding before the number.`,m:`Rushing, or acting surprised by something they disclosed.`},
rpre:{g:`Take the sting out before the number drops.`,p:`#8 Pre-handle · #4 Future pace`,w:`Acknowledging what they need shows you heard them without repeating another number on the call.`,t:`Calm and respectful.`,a:`Their need is acknowledged and they know you fought for it.`,m:`Repeating their old number or skipping the concern entirely.`},
rnum:{g:`Choose and deliver your number, stack certainty, stop talking.`,p:`#5 Certainty · #7 Silence`,w:`Where we're at is dispo's ceiling, not an automatic spoken number. Choose your number below it. Certainty counterbalances the drop, and silence shows their real position.`,t:`Late-night FM DJ voice. Downward inflection.`,a:`They respond first.`,m:`Going at or above where we're at, naming other dollar amounts, or hinting there's room.`},
rpush:{g:`Handle pushback with the principle that fits.`,p:`#2 Alternative uncertain · #3 Sunk cost · #4 Future pace · #5 Certainty`,w:`Use only what's true in this deal. Their own words from earlier calls are the strongest.`,t:`Calm. Don't fold on the first push.`,a:`The objection is handled and you're back to the close.`,m:`Arguing, over-explaining, or moving on price.`},
racc:{g:`Hold the frame if they accuse you.`,p:`Rule 12 · Silence`,w:`The more you explain after an accusation, the guiltier you sound. Silence holds the frame.`,t:`One calm sentence. Then silence.`,a:`They move past the accusation.`,m:`Justifying, explaining the business model, or apologizing repeatedly.`},
rcounter:{g:`Don't change your number on this call.`,p:`Rule 11`,w:`You choose the number you present below where we're at. If they counter, take it back to the team and end the call. Any new number comes from the team on a separate call and must also stay below the ceiling.`,t:`Calm. Short.`,a:`You're off the call without moving.`,m:`Hinting at room or trying to improve the number on the same call.`},
rult:{g:`Match a real ultimatum calmly.`,p:`#6 Ultimatum · Loss aversion`,w:`The deal walking away is scarier than a lower price. Only works when it's real.`,t:`Calm. A tool, not a threat.`,a:`They re-engage, or you cancel.`,m:`Using it preemptively or bluffing.`},
rclose:{g:`Put the ball in their court.`,p:`#10 Calibrated question · Commitment`,w:`When they propose the solution, they're committed to it.`,t:`Curious, calm.`,a:`Agreement, a counter to take back, an exact next time, or a clean no.`,m:`Ending without a clear next step.`},
rhook:{g:`Leave the door open.`,p:`#9 Hook · Scarcity`,w:`They'll remember your offer when their alternative falls through.`,t:`Friendly. No hard feelings.`,a:`Relationship intact, next step logged.`,m:`Burning the relationship on the way out.`},
rstr:{g:`Deliver the team's approved number on a separate call.`,p:`Rule 11 · #1 Advocate`,w:`Only the team can approve a new number after a counter. A separate call keeps the first number firm and makes any approved movement clear.`,t:`Late-night FM DJ voice.`,a:`They accept, take it to the seller, or it's a clean no.`,m:`Naming a new number before the team approves it or negotiating live.`}
};

// REALTOR · FIRST CALL
r_open:{t:`Open`,c:`open`,l:[['s',`Hey [Name], this is [Your Name] — how's your day going?`],['c',`Wait`],['s',`I'll keep this quick. You were texting my team about [Address]. Probably caught you at a bad time?`],['o',`If they have time`,`Perfect, appreciate that.`]],b:[['Good time','r_sit'],['Bad time','r_bad']]},
r_bad:{t:`Bad time`,c:`open`,a:'r_open',l:[['s',`No problem. When's better — later today or tomorrow?`],['c',`Set an exact day and time. Log it in Podio.`]],b:[['End call','_end']]},
r_sit:{t:`Motivation`,c:`sit`,l:[['s',`What's going on with the seller's situation?`],['c',`Let them talk. Write down any move date, divorce, death, or money problems they mention.`],['n',`If the problem is already clear, do not force more questions. If you need more, choose one or two that fit what they said.`],['o',`Easy follow-up`,`Tell me a little more about that.`],['o',`If it has been going on for a while`,`How long has that been going on?`],['o',`If they live out of state`,`What's been hardest about managing the property from a distance?`],['o',`If tenants are the problem`,`What's been the biggest headache with the tenants?`],['o',`If you need to know what happens next`,`If they don't get an offer that works, what will they do?`],['s',`Sounds like the biggest issue is [tenants / managing it from out of state / a few words they used]. Is that right?`],['n',`Use a few words they already said. Do not create a new explanation.`]],b:[['They start opening up →','r_sitdeep'],['Agent is guarded','r_guard']]},
r_sitdeep:{t:`Motivation: Go deeper & build rapport`,c:`sit`,a:'r_sit',l:[['n',`If the problem is already clear, do not force more questions. If you need more, choose one or two that fit what they said.`],['o',`Easy follow-up`,`Tell me a little more about that.`],['o',`If it has been going on for a while`,`How long has that been going on?`],['o',`If they live out of state`,`What's been hardest about managing the property from a distance?`],['o',`If tenants are the problem`,`What's been the biggest headache with the tenants?`],['o',`If you need to know what happens next`,`If they don't get an offer that works, what will they do?`],['s',`Sounds like the biggest issue is [tenants / managing it from out of state / a few words they used]. Is that right?`],['n',`Use a few words they already said. Do not create a new explanation.`]],b:[['Next →','r_dec']]},
r_guard:{t:`Motivation: guarded`,c:`sit`,a:'r_sit',l:[['s',`Totally fair. I only ask because a lot of agents we work with share that upfront — helps us structure the offer around what the seller actually needs. But no pressure — let's talk about the property.`]],b:[['They open up →','r_sitdeep'],['Still guarded →','r_dec']]},
r_dec:{t:`Urgency`,c:`urg`,l:[['s',`We're in a position to move quickly. If we can make the numbers work, what does the decision process look like on the seller's side? Is it one person making the decision, or does anyone else need to be involved?`],['o',`If one person makes the decision`,`Got it — that helps us know what to expect.`],['o',`If anyone else is involved`,`Got it. Will everyone have a chance to review the offer together?`],['o',`If they need to see the offer first`,`Understood. Let's see what we can do.`]],b:[['Next →','r_cond']]},
r_cond:{t:`Property details`,c:`cond`,l:[['n',`Check the CRM first. If an answer is already there, confirm it instead of asking from scratch: “I have three bedrooms and two baths here — is that still correct?” Use the actual details in the CRM.`],['s',`Walk me through the property — what kind of shape is it in?`],['c',`Let them describe it first.`],['s',`What about the big stuff — roof, AC, water heater? Know the ages?`],['s',`And the basics — beds, baths, square footage?`],['s',`Any updates in the last few years?`],['s',`Solar? Owned or leased?`],['s',`Is there an HOA? How much, and what does it cover?`],['s',`Any structural issues or major red flags we should know about?`],['o',`If they don't know the roof, AC, or water heater ages`,`No worries — if you can find out, that helps. Those are the first things we check.`],['o',`If there's a pool`,`Pool working or need repairs?`],['o',`If it's a manufactured home`,`Single or double-wide? What year? City water or well? Septic — when was it last serviced?`],['o',`If it's septic or land`,`Has a soil test or perc test been done?`],['o',`If they mention problems`,`Good to know. That's why we buy as-is — so the seller doesn't have to deal with any of that.`],['c',`Before leaving this section, ask for photos if you do not have them.`]],b:[['Next →','r_time']]},
r_time:{t:`Timeline`,c:`time`,l:[['s',`What's the timeline here — is there a date they're working toward?`],['o',`If they give a date`,`Okay, I've noted that.`],['o',`If they ask how soon we can close`,`We put 30 days in the agreement to give the title company or closing attorney time to clear everything, but we can close earlier once they give us the go-ahead.`],['o',`If no rush`,`Good — gives us room to make it easy on everyone.`],['n',`If they need a faster closing: we've closed in about 21 days. Confirm the timing with the title company or closing attorney before promising a date.`]],b:[['Next →','r_owe']]},
r_owe:{t:`Mortgage & equity`,c:`owe`,l:[['s',`Is there a mortgage on the property? Roughly what do they owe?`],['c',`Write down the rough payoff. Don't react.`],['o',`If they ask why`,`Totally get it. We look at a lot of properties, and we just want to make sure there's enough equity before we make an offer. Even a rough payoff helps — about what do they owe?`],['o',`If they don't know or still won't share`,`No problem. If you can check with them before our offer call, that helps us avoid bringing something that won't work.`]],b:[['Next →','r_price']]},
r_price:{t:`Price`,c:`price`,l:[['s',`Is there a number they have in mind?`],['s',`Once everyone has reviewed the offer, what's a realistic timeframe for a decision?`],['c',`Write their number down. Don't react.`],['o',`If they give a number`,`By the way. Is there flexibility there, or is that firm?`],['o',`After they give a number`,`Let me see what I can do. Send me some pictures and I'll take it to the underwriting team — see if we can make that work.`],['o',`If they won't give a number — one more try`,`Totally get it. We're looking at a few properties, and our underwriting team has a pretty tight range. I don't want either of us chasing something that's not close. Even a ballpark helps — where do the sellers need to be?`],['o',`If they still won't give a number`,`That's fine — we'll underwrite it based on the property's as-is condition and come back with what we can offer.`],['o',`If they say to come see it`,`We'd love to see it. We look at a lot of properties though, so we wait until we have an agreement in place before we send our team out. Tell you what — send me some pictures for now and let's see if we can get close on numbers.`]],b:[['Next →','r_frame']]},
r_frame:{t:`Process`,c:`frame`,l:[['s',`Let me tell you how we work so there's no surprises.`],['s',`Once we agree on price, we sign an agreement. Our team does a quick walk-through to verify the condition. If everything checks out, we close on schedule.`],['s',`If something comes up that wasn't mentioned or we couldn't see from photos, we work through it together. No ghosting, no games — just communication.`],['s',`Sound fair?`],['o',`If they seem worried about a retrade`,`No, that's not how we operate. We worked with an agent last month who had the same concern — she'd been burned by investors before. We walked the property, everything matched what she told us, closed in 18 days. She sent us another deal last week.`]],b:[['Next →','r_dual']]},
r_dual:{t:`Dual representation`,c:`dec`,l:[['s',`One more thing — we don't have an agent on our side. Would you be open to representing us on the offer?`],['o',`If yes`,`Great — we'll work directly with you then.`],['o',`If they ask about commission`,`We typically do 1% of the purchase price or a flat fee. We can work out the details when we get there.`],['o',`If they need to check`,`No problem — just let me know.`]],b:[['Next →','r_end1']]},
r_end1:{t:`Close the first call`,c:`end1`,l:[['s',`Alright — I've got what I need. I'll get with my team and have something for you by [TIMEFRAME].`],['s',`Best email to send it to?`],['s',`Perfect. Talk soon, [Name].`],['c',`Set the exact day and time for the next call.`],['n',`Save the call notes in Podio.`],['n',`Before you make the offer, open the Four Gates and keep it beside this script. The script tells you what to say. The Four Gates tells you what to do next — from checking whether we should offer to getting the seller's answer and working the number.`]],b:[['Go to Offer Call →','@offer'],['End call','_end']]},
// REALTOR · OFFER CALL
r_g1:{t:`Reconnect`,c:`open`,l:[['s',`Hey [Name], it's [Your Name] with Cactus. Got a minute?`],['o',`If they have time`,`Good — I just got out of underwriting on [Address]. Got the numbers back.`],['o',`If it's a bad time`,`No problem — when works better?`]],b:[['Good time →','r_g2'],['Set callback','_end']]},
r_g2:{t:`Process review`,c:`frame`,l:[['s',`Before I give you the number — quick reminder on how we work.`],['o',`If you already have photos`,`Once we agree, we sign, and our team does a quick walk-through to verify condition. Title works in the background. Once it all clears — we close and your client gets paid.`],['o',`If you don't have photos yet`,`Once we agree, we sign, get photos within 24 hours, and our team does a quick walk-through to verify condition. Title works in the background. Once it all clears — we close and your client gets paid.`],['s',`Simple.`]],b:[['Next →','r_g3']]},
r_g2push:{t:`Agent reaction is not seller rejection`,c:`g2`,a:'r_g3',l:[['c',`Let them finish. Keep your tone calm. Knowing the seller’s asking price is not the seller’s answer to our offer. Do not negotiate against the agent’s reaction.`],['s',`Okay, I understand. Can you present it to them and let me know what they say?`],['s',`We had an agent who didn’t think her seller would take our offer either. But when she presented it, the seller opened up about personal issues she hadn’t known about—and told her to accept. The price was lower than they wanted, but our terms worked for what they were going through. She didn’t find that out until she presented our offer.`],['c',`Pause and let the agent respond. If they agree to present it, set the presentation and callback times. Do not raise the offer or add commission.`],['n',`Do not argue that the agent is missing information or promise the same result. If they refuse to present, use the refusal response. Gate 3 starts after the seller responds to this offer—not after a conversation about their asking price.`]],b:[['Seller already answered this offer','r_g3d'],['Seller gave a counter','r_g3c'],['Agent will present it','r_g2lock'],['Seller accepted','r_lock']]},
r_g2lock:{t:`Presentation follow-up`,c:`g3`,a:'r_g3',l:[['s',`When will you be presenting it?`],['c',`Wait`],['s',`Great. I'll call you [day/time] to hear what they said.`],['n',`Log the offer and follow-up time in Podio.`]],b:[['Follow-up call →','r_g3d']]},
r_g3:{t:`Deliver the number`,c:`g2`,l:[['n',`DON'T GIVE ANYTHING AWAY FOR FREE. Give the approved offer and wait. Don't volunteer commission, a higher price, or other concessions. Get a clear commitment before taking a change to the team for approval.`],['s',`So here's where we landed...`],['c',`Pause`],['s',`I'll be honest — I was hoping we'd be closer to what you wanted. I pushed on this one.`],['s',`The underwriting team came back at $[AMOUNT].`],['o',`Large-gap offer — use instead of the normal delivery`,`This is probably going to feel far from where your seller wants to be. Based on the as-is numbers, underwriting came back at $[AMOUNT].`],['c',`STOP TALKING — wait for the response`]],b:[['They agree','r_lock'],['Agent pushes back','r_g2push'],['Agent will present it','r_g2lock']]},
r_g3c:{t:`Verify the counter`,c:`g3`,a:'r_g2push',l:[['s',`Did that counter come directly from the seller?`]],b:[['Yes, from the seller','r_g4c'],["No, agent's guess",'r_g3d']]},
r_g3d:{t:`Get the seller's answer`,c:`g3`,a:'r_g3',l:[['n',`Use as soon as the seller has answered this offer—even on the first offer call. If the agent already gave the answer, use it; do not make them repeat it or ask them to present again.`],['s',`What exactly did the seller say?`],['n',`"Thinking" or the agent's guess is not a counteroffer. Keep the offer in place.`]],b:[['Accepted','r_lock'],['Countered','r_g3c'],['Rejected','r_g4'],['Still deciding','r_g2lock']]},
r_g4:{t:`Work the seller’s answer`,c:`g4`,l:[['n',`Only after a real seller counter, rejection with a number, specific objection, or new information.`],['s',`Is it just the price, or is something else not working?`],['o',`If another term is the problem`,`If we solve that issue, does our price work?`],['o',`If the seller is firm on price`,`It sounds like the seller is pretty firm on that number. Help me understand what they’re looking at. Are there comps or upgrades that our underwriting team may have missed?`],['o',`If there is still a large gap`,`If they don’t get that price, what’s their plan for the property?`],['n',`Hold the offer without supporting information. Do not invent consequences or promise an increase.`]],b:[['Seller accepts current offer','r_lock'],['Review a real counter','r_g4c'],['No path','nodeal']]},
r_g4c:{t:`Lock commitment`,c:`g4`,a:'r_g4',l:[['c',`Collect evidence: comps, photos, upgrades, repairs. A seller’s desired number alone is not proof of value.`],['s',`If we can get that approved, will everyone sign with everything else staying the same?`],['n',`If uncertain, hold the current offer and have the agent confirm. Do not invent a higher number. Keep the current offer until a new amount is approved.`],['c',`If they agree to the approved price, complete the final access check in Close before ending the call.`]],b:[["Yes, they're ready",'r_g4ap'],['No commitment','r_g3d']]},
r_g4ap:{t:`Get final approval`,c:`g4`,a:'r_g4c',l:[['n',`Stay within the approved range. Anything above the ceiling goes back to underwriting. Promise nothing. Keep the current offer until a new amount is approved.`],['o',`Only after approval`,`The team approved $[AMOUNT]. If that works, let’s get the agreement signed.`]],b:[['Approved → Lock it','r_lock']]},
r_lock:{t:`Lock it`,c:`agree`,l:[['s',`Done. Let me get final approval — one second.`],['c',`Confirm approval before naming the final number.`],['s',`Alright — we're good at $[AMOUNT]. Go ahead and write up the agreement, and once your seller signs we're off to the races.`],['o',`If they want us to write it`,`No problem, we'll get it written up.`],['s',`I'm sending over the offer form now. There's a section in red with the additional terms — make sure those get included when you write it up.`],['s',`And when do they want to close?`],['o',`If they ask how soon we can close`,`We put 30 days in the agreement to give the title company or closing attorney time to clear everything, but we can close earlier once they give us the go-ahead.`],['n',`Default to 30 days. If they need sooner, confirm the date with the title company or closing attorney before promising it. About 21 days is past experience, not a promise or a date to push.`],['c',`A 10-day inspection is standard. If they require 7 or 5 days, get photos before agreeing.`],['c',`Confirm they have pictures or will send them.`],['s',`Once this is signed, our team will reach out to coordinate pictures and the walk-through — everything we talked about.`]],b:[['Next →','r_agree']]},
r_agree:{t:`Close`,c:`agree`,l:[['c',`Confirm who is signing and when.`],['s',`One last thing — how will our third-party team get in to confirm the condition? Is there a lockbox, or should we set a time to meet someone there?`],['o',`If there is a lockbox`,`Who can get us the lockbox location and code?`],['o',`If a lockbox will be installed`,`Who will set it up, and when will it be ready?`],['o',`If someone will let us in`,`What day and time works, and who will meet the team?`],['o',`If tenants live there`,`Who will coordinate access with the tenants and confirm that time works for them?`],['c',`Save the access plan and contact in Podio. Confirm the lockbox is ready or the entry appointment is set before sending the third-party team out.`],['s',`Perfect. Sending it over now. I'll follow up once it's signed. Thanks [Name] — talk soon.`],['n',`Log the offer in Podio and send the offer form.`]],b:[['Post-contract check-in','r_check'],['Done','_end']]},
r_check:{t:`Post-contract check-in (Day 2–3)`,c:`check`,l:[['s',`Hey [Name] — just checking in. Our team should be reaching out to coordinate everything. Anything new on your end?`],['s',`Any changes with your client's timeline?`],['n',`Log the update in Podio.`]],b:[['Done','_end']]},
nodeal:{t:`No deal today`,c:`g1`,l:[['n',`Record why in Podio. Keep the relationship for the next one.`]],b:[['End','_end']]},

s_o_text:{t:`Open: Text`,c:`open`,a:'s_ch',l:[['s',`Hey [Name], this is [Your Name]. I saw you were texting about [Address]. How's it going?`],['c',`Wait`],['s',`Did I catch you at a bad time?`],['n',`Hold the company name until they ask.`],['o',`If they ask who you are`,`I work with a group that buys houses in the area.`]],b:[['Good time','s_exp'],['Bad time','s_bad']]},

s_o_in:{t:`Open: Inbound call`,c:`open`,a:'s_ch',l:[['s',`Thanks for calling Cactus Home Offer, this is [Your Name]. Who am I speaking with?`],['c',`Get name`],['s',`Nice to meet you [Name]. What's the address of the property you're calling about?`],['c',`Get address`],['s',`Got it. Did I catch you at a bad time?`]],b:[['Good time','s_exp'],['Bad time','s_bad']]},
s_o_cold:{t:`Open: Cold call lead`,c:`open`,a:'s_ch',l:[['s',`Hey [Name], this is [Your Name]. You spoke with [Caller] the other day about [Address]. How's it going?`],['c',`Wait`],['s',`Did I catch you at a bad time?`],['n',`The caller already confirmed the property details. Confirm what's in Podio instead of re-asking.`]],b:[['Good time','s_exp'],['Bad time','s_bad']]},
s_bad:{t:`Bad time`,c:`open`,a:'s_ch',l:[['s',`No problem. When's better — later today or tomorrow?`],['c',`Set an exact day and time. Log it in Podio.`]],b:[['End call','_end']]},
s_exp:{t:`Set expectations`,c:`exp`,l:[['s',`The goal of this call is to see if your property qualifies for an as-is cash offer. I'll ask you some questions — roof, AC, condition, that kind of stuff. Then I take it to our underwriter and see what it qualifies for.`],['s',`All I ask is when I come back with the number, you give me a straight yes or no. And no is totally fine — at least we both know where we stand. Fair enough?`],['c',`Wait`]],b:[['Next →','s_sit']]},
s_sit:{t:`Situation`,c:`ssit`,l:[['s',`So what's going on with the property?`],['c',`Let them talk. Do not interrupt.`],['n',`They may talk about the property or a personal problem. Listen for the part that matters most. If they mention foreclosure, probate, divorce, or tenants, use the objections listed in this section.`]],b:[['Next →','s_cond']]},
s_cond:{t:`Condition`,c:`cond`,l:[['s',`Walk me through the property. What's the condition like?`],['c',`Let them describe it first. Ask only for details they leave out.`],['o',`If they need prompting`,`How old is the roof? AC/Heat? Water heater? Any foundation issues? What about the kitchen and bathrooms — original or updated?`],['s',`I'm showing it's [beds] bed, [baths] bath, about [sq ft] square feet, built around [year]. Sound right? Anyone living there right now? Is it listed with an agent?`]],b:[['Next →','s_mot'],["It's land",'s_land']]},
s_land:{t:`Condition: Land`,c:`cond`,a:'s_cond',l:[['s',`Tell me about the lot. What's the access like? Any utilities on site?`],['c',`Let them lead`],['o',`If they need prompting`,`Is it cleared or wooded? Any zoning restrictions? Flood zone? Perc test done?`]],b:[['Next →','s_mot']]},
s_mot:{t:`Motivation`,c:`mot`,l:[['s',`Catch me up to speed — what's going on with the property and your situation?`],['c',`Let them talk. Write down the main problem and what happens if they do not sell.`],['o',`If they're guarded (use a real example)`,`I ask because we had a seller last month in a similar situation — dealing with [relate to what you know]. Once we understood what was going on, we were able to help them out. What's your situation?`],['s',`How long has this been going on?`],['s',`What happens if you don't sell?`],['s',`What are you planning to do once this is done?`]],b:[['Next →','s_urg']]},
s_urg:{t:`Commitment`,c:`urg`,l:[['o',`Only say if true`,`We just sold a couple properties in your area and have some funds available to buy another one. Hopefully your house is a good fit for us.`],['s',`If we come to an agreement on a fair price, you're definitely ready to sell it?`],['c',`Wait for confirmation`]],b:[['Next →','s_dm']]},
s_dm:{t:`Decision makers`,c:`dec`,l:[['s',`Is it just you on the title, or is there anyone else involved in the decision?`],['o',`If others are involved`,`Are they on board with selling? When's the last time you talked about it?`],['o',`If inherited`,`Has probate been opened? Who has authority to sign? Are the other heirs on board?`],['o',`If divorce`,`Are you both on the title? Are you both on board with selling?`]],b:[['Next →','s_owe']]},
s_owe:{t:`Mortgage & liens`,c:`owe`,l:[['s',`Is there a mortgage or any liens on it? Roughly how much is owed?`],['c',`Write down the amount. Keep your voice neutral.`],['o',`If they ask why`,`Totally get it. We look at a lot of properties, and we just want to make sure there's enough equity before we make an offer. Even a rough payoff helps — about what do you owe?`],['o',`If they still won't share`,`No problem. Just know the payoff can affect whether an offer works.`],['s',`Are you current on payments?`],['o',`If they're behind`,`How far behind are you? Is there an auction date?`],['n',`If there is an auction date, tell management right away. We may be able to close before it if the numbers work.`]],b:[['Next →','s_time']]},
s_time:{t:`Timeline`,c:`time`,l:[['s',`If we came to an agreement today, when would you ideally want to close?`],['c',`Wait`]],b:[['Next →','s_price']]},
s_price:{t:`Price`,c:`price`,l:[['s',`In a perfect world, what were you hoping to walk away with?`],['c',`Wait — write it down`],['s',`And is that the best you can do, or is there some flexibility there?`]],b:[['Next →','s_end1']]},
s_end1:{t:`Set the callback`,c:`end1`,l:[['s',`Alright [Name], I've got everything I need. Let me take this back to my team and run the numbers. I'll give you a call back — what's the best time to reach you?`],['c',`Set the exact day and time for the next call.`],['s',`Perfect. I'll call you [time]. Talk soon.`],['o',`If they can`,`Can you text me a few pictures of the inside? It helps me get you the most accurate number.`],['n',`If you already have an approved number, go to the Offer Call. Save the call notes in Podio.`]],b:[['Go to Offer Call →','@offer'],['End call','_end']]},

s_proc:{t:`Gate 2: Process + value`,c:`frame`,l:[['s',`It's really straightforward. Once we agree on a number, we sign an agreement to get started. We get photos of the property, do a quick walkthrough to confirm condition, and title clears in the background. Once everything checks out, we close and you get paid. Usually 21–30 days, but we work with your timeline.`],['c',`Pause`],['s',`We buy it as-is. No repairs, no cleaning. We cover closing costs. No commission. You walk away clean.`],['s',`If something comes up at the walkthrough that wasn't mentioned or we couldn't see from photos, we work through it together. No ghosting, no games.`],['c',`Pause`],['s',`Any questions before we talk numbers?`],['n',`Common questions here (fees, closing date, staying after, moving money) are under Closing & move-out in the panel.`]],b:[['Next →','s_anc']]},
s_anc:{t:`Gate 2: Prepare them for the number`,c:`anchor`,l:[['s',`So... [Name]... I gotta be honest with you.`],['c',`Sigh. Slow way down.`],['o',`If they have a situation (divorce, foreclosure, inherited, relocating)`,`I know you're dealing with [their situation]. And I really wanted to make this work for you.`],['o',`If it's just a beat-up house`,`I know the property needs a lot of work. And I really wanted to get you a number that made sense.`],['c',`Pause`],['s',`I went back and forth with underwriting on this... but the number just isn't where I was hoping it would be.`],['c',`Pause — let the tension build`]],b:[['Next →','s_del']]},

s_push:{t:`Gate 4: Price pushback`,c:`push`,l:[['s',`I completely understand. And look — I'm on your side here. This is what they authorized, but let me see if there's anything they can do.`],['c',`Pause`],['s',`Before I go back to them... where do you need to be to walk away happy?`],['c',`Get their number`],['s',`Is that the number I should take back to underwriting?`],['s',`If they can get there — are you ready to move forward today?`],['o',`If they won't budge (pause first)`,`Is this deal dead?`],['n',`Keep going back to underwriting. Come up little by little. Never negotiate live.`]],b:[['Gap closed','s_close'],["Cash still doesn't work",'s_alt']]},

s_ta:{t:`Gate 4: Time & Access`,c:`ta`,a:'s_alt',l:[['s',`We can do that.`],['c',`Pause — let it land`],['s',`We just need time and access.`],['c',`Wait for response`],['o',`If they ask what that means`,`Time to close, and access to the property so we can confirm condition. That's all we need to get you that number.`],['n',`Same energy as a cash deal. No backup-option talk. No separate pitch.`]],b:[['Agrees → Close it','s_close']]},
s_prem:{t:`Gate 4: Premium option`,c:`prem`,a:'s_alt',l:[['s',`I understand. We really like the property. It's the type of house we like to buy. I'd love to be able to help out here. It sounds like we're on the same page other than the price...`],['c',`Pause — let them confirm`],['s',`Look — you need to be at $[X]. I get it. So let us go to work for you.`],['o',`Only say if true`,`85% of the sellers we work with end up taking advantage of this. Our cash number doesn't work — so we just go find them a buyer who will pay their price.`],['s',`Here's the thing — our goal is to get you that number. But to do that, we need time and access to the property. All you need to do is sign the agreement, which gives us permission to go to work for you.`],['s',`Once we get that agreement, we start marketing. We leverage the MLS, tap into our network of buyers, and find someone who can actually pay what you're looking for.`],['s',`You don't do showings. You don't deal with buyers. You don't coordinate anything. We handle all of that. We just call you when we find the right one.`],['o',`Only use a real deal`,`We just did this a few weeks ago. Seller needed $180. Our cash offer was $140. Too far apart. We went to work for them — found a buyer at $175, handled the whole thing, they didn't have to do anything.`]],b:[['Agrees','s_pclose'],['Not interested','s_ref']]},

s_pclose:{t:`Close it: Premium`,c:`agree`,a:'s_close',l:[['s',`Alright, let me tell you what happens next.`],['s',`I'm going to send you a simple agreement. It gives us permission to market the property and find you a buyer.`],['s',`Once you sign, I need pictures of the property within 24 hours — inside and out. Then we schedule a quick walk-through so we can show it properly.`],['s',`After that, we go to work finding you a buyer. You get your money when we close.`],['s',`Before I send this over — is there anything that would stop you from moving forward once you sign?`],['c',`Wait. Handle anything they bring up now, not after they sign.`],['o',`If they've talked to other buyers`,`If anyone else reaches out after this, all I ask is that you call me first. Fair enough?`],['s',`What's the best email to send this to?`],['c',`Get email. Send the agreement while on the phone.`],['o',`If they want to review later`,`No problem. I'll follow up tomorrow if I don't hear from you. Sound good?`],['s',`Any questions before we hop off?`],['n',`Log everything in Podio. Set the Day 2–3 check-in (After Contract tab).`]],b:[['Done','_end']]},

function mkRT(p,R){
  const outs=[['Agrees',p+'done'],['Counters',p+'counter'],['Needs time',p+'talk'],["It's dead",p+'hook']];
  const push=[['What specifically?',p+'spec'],[R?"Seller won't take it":"I won't take that",p+'wont'],['Counters',p+'counter'],['Accuses you',p+'acc'],['Other offer / will list',p+'alt'],['Money already put in',p+'sunk'],['Ultimatum: cancel',p+'ult'],[R?'Let me talk to the seller':'Needs to think',p+'talk'],['Agrees',p+'done']];
  const st={};
  st[p+'prep']={t:`Retrade: Build the script`,c:`rprep`,brief:1,l:[],
    b:R?[['Run the call step by step →',p+'open']]:[['Run the call step by step →',p+'open'],['Time & Access opener →',p+'ta']]};
  st[p+'open']={t:`Retrade: Open as advocate`,c:`radv`,l:[
    ['s',`Hey [Name], it's [Your Name]. Got a minute? I went back to my team on [Address] because I didn't want to lose this deal, and I want to be straight with you.`],
    ['c',`Let them respond`],
    ['s',`I pushed on this one. The numbers came back different than what we had.`],
    ['c',`Pause. Let it land.`]],b:[['Next →',p+'find']]};
  st[p+'find']={t:`Retrade: Stack the findings`,c:`rfind`,l:[
    ['o',`If it's new (they never mentioned it)`,`When our team walked it, we found [finding]. That wasn't something we could see in the photos.`],
    ['o',`If it's scope (they told us, but the numbers changed)`,`You were upfront with us about [item], and we had that in our numbers. The numbers came back different than what we had.`],
    ['o',`If it's mixed or you're not sure`,`You were upfront with us about most of this, and we had it in our numbers. The numbers came back different than what we had, and [finding] wasn't something we could see in the photos.`],
    ['c',`One finding at a time. Pause between each.`],
    ['n',`Never act surprised by something they disclosed.`]],b:[['Next →',p+'pre']]};
  st[p+'pre']={t:`Retrade: Pre-handle`,c:`rpre`,l:[
    ['o',`If they stated a floor`,R?`I know the seller has been clear about what they need, and I pushed for that.`:`I know you've been clear about what you need, and I pushed for that.`],
    ['s',`But after where the numbers came back, this is where we are.`],
    ['o',`Future pace (one sentence)`,`Anybody who walks this property is going to see the same things we found.`]],b:[['Next →',p+'num']]};
  st[p+'num']={t:`Retrade: The number`,c:`rnum`,l:[
    ['s',`We need to be at [YOUR NUMBER].`],
    ['s',`We're cash, we close on schedule, everything else stays the same.`],
    ['c',`SILENCE. Count to 15. They speak first.`],
    ['n',`Your call — below where we're at in the Deal Adjustment Brief. Do not put any other dollar amount in your lines.`]],b:push};
  st[p+'spec']={t:`Pushback: "What specifically?"`,c:`rpush`,a:p+'num',l:[
    ['s',`The [biggest item] is the big one. Then [smaller items]. The numbers came back different than what we had.`],
    ['n',`Short. Specific on the big item, general on the rest. Own the underwriting miss. Never blame them.`]],b:[['Next →',p+'close']]};
  st[p+'wont']={t:R?`Pushback: "The seller won't take that"`:`Pushback: "I won't take that"`,c:`rpush`,a:p+'num',l:R?[
    ['s',`Just present it to them with [close date / terms] in the picture. [their motivation]. Let them decide.`],
    ['n',`Make the agent the messenger. Don't let them kill it before the seller sees it.`]]:[
    ['s',`I hear you. You told me [their motivation]. At [YOUR NUMBER] with [close date / terms], you're done and moving on.`],
    ['c',`Silence`]],b:[['Next →',p+'close']]};
  st[p+'counter']={t:`Pushback: They counter`,c:`rcounter`,a:p+'num',l:[
    ['s',`Let me take that back to my team.`],
    ['n',`GET OFF THE CALL. Do not change your number. Any new number must come from the team on a separate call.`]],b:[['Second call (if approved) →',p+'str'],['End call','_end']]};
  st[p+'acc']={t:`Pushback: Accused`,c:`racc`,a:p+'num',l:[
    ['s',`I understand how it looks. The numbers just came back different than we expected.`],
    ['c',`Silence. Don't justify, explain, or apologize again.`],
    ['o',`If they press`,`I hear you. This is where the numbers landed.`],
    ['o',`If they say "I told you about all of this"`,`You're right, you did. We had it in our numbers. The numbers came back different than what we had. I'm being straight with you instead of making something up.`],
    ['o',`If they bring up what we said before`,`You're right, we said [what we said before]. That was before the walkthrough. What we found moved the numbers. That's exactly why we do it.`]],b:[['Next →',p+'close']]};
  st[p+'alt']={t:`Pushback: Other offer or listing`,c:`rpush`,a:p+'num',l:[
    ['o',`Competing offer`,`What did the other offer come in at? Have they done their inspection yet? Their number isn't real until they do.`],
    ['o',`Listing`,`Listing it doesn't mean selling it. That's showings, financing, appraisals, and months of waiting.`],
    ['o',`Use their own words`,`You told me yourself — [their words].`],
    ['s',`Anybody who walks it is going to find the same things we did. We're cash, and we close on schedule.`],
    ['c',`Silence`]],b:[['Next →',p+'close']]};
  st[p+'sunk']={t:`Pushback: Money already put in`,c:`rpush`,a:p+'num',l:[
    ['s',R?`I hear you. Whatever they already put into it is spent. It's gone whether they sell to us or hold it another year.`:`I hear you. Whatever you already put into it is spent. It's gone whether you sell to us or hold it another year.`],
    ['c',`Pause`]],b:[['Next →',p+'close']]};
  st[p+'ult']={t:`Pushback: Ultimatum`,c:`rult`,a:p+'num',l:[
    ['n',`Only if they gave a specific ultimatum first. Never bluff.`],
    ['s',`I'll send the cancellation. But before I do — can I ask you one thing?`],
    ['c',`Pause`],
    ['s',`What would it take to make this work?`]],b:outs};
  st[p+'talk']={t:R?`"Let me talk to the seller"`:`Needs time`,c:`rclose`,a:p+'close',l:[
    ['s',R?`Of course. When do you think you'll hear back?`:`No problem. When will you have an answer for me?`],
    ['c',`Lock an exact time. Log it in Podio.`]],b:[['End call','_end']]};
  st[p+'close']={t:`Retrade: Close`,c:`rclose`,l:[
    ['s',`What would it take to make this work?`],
    ['o',`Or`,`How do we get this across the finish line?`],
    ['n',R?`If the agent is just a messenger and can't decide on the call, skip the question. Restate the number, stay silent, and lock a time.`:`Let them solve it. Silence after the question.`]],b:outs};
  st[p+'hook']={t:`Retrade: Hook`,c:`rhook`,a:p+'close',l:[
    ['s',`I understand. If things change, you've got my number. I can't guarantee this number will still be available.`],
    R?['o',`Protect the relationship`,`And send me the next one — this is the first deal, not the last.`]:['c',`Stay friendly`],
    ['n',`Log it in Podio.`]],b:[['Done','_end']]};
  st[p+'done']={t:`Retrade: Agreed`,c:`rclose`,a:p+'close',l:[
    ['n',`Send the updated agreement. Log the new price and the reason in Podio.`]],b:[['Done','_end']]};
  st[p+'str']={t:`Retrade: Second call (team-approved number)`,c:`rstr`,l:[
    ['n',`Use this only if the team approves a new number after the counter. The approved number must stay below where we're at. Never invent or imply movement.`],
    ['s',`Hey [Name], I took your counter back to my team. They approved [TEAM'S APPROVED NUMBER]. That's the number the team approved.`],
    ['c',`SILENCE`],
    R?['s',`Can you take that to them?`]:['c',`Let them respond`]],b:[['Agrees',p+'done'],['Needs time',p+'talk'],["It's dead",p+'hook']]};
  if(!R) st[p+'ta']={t:`Retrade: Time & Access buyer`,c:`rnum`,a:p+'num',l:[
    ['o',`House`,`Hey [Name], I found a buyer. Good news — they want the property. But they're requesting more repairs than I expected. I still want to close with you and do the repairs for them, but I'm gonna need to be at [YOUR NUMBER] to make this work.`],
    ['o',`Land`,`Hey [Name], I found someone who wants to build on this lot. Good news — they want it. But to make the deal work for them, I'm gonna need to be at [YOUR NUMBER].`],
    ['n',`Your call — below where we're at in the Deal Adjustment Brief. Do not put any other dollar amount in your lines.`],
    ['c',`SILENCE. Count to 15. They speak first.`]],b:push};
  return st;
}

9. Use their own words from the transcripts when it helps, but only words that are actually in the transcripts.
10. Every spoken line must be something the closer can read word for word.
11. The transcripts are auto-generated and contain errors (wrong words, misheard names and places). Use context to understand what was meant. Never quote a garbled phrase. If you're not sure of a name or place, keep it general.

THE FRAMEWORK (CHO Retrade Framework v1.5)
Always use:
#1 Advocate — The closer fought for the deal and is delivering news from the team. "I went back to my team on this because I didn't want to lose the deal." Never say "We need you to come down."
#7 Silence — After every number and key statement, stop talking. Count to 15. They speak first.
#10 Calibrated Close — "What would it take to make this work?" or "How do we get this across the finish line?"
Use only when the facts support it:
#2 Alternative Uncertain — competing offer or listing threat. "Has the other buyer done their inspection yet? So their offer isn't real yet." "Listing it doesn't mean selling it."
#3 Sunk Cost — only if they mentioned money they put in. "Whatever you already put into it is spent. It's gone whether you sell to us or hold it another year."
#4 Future Pace — "Anybody who walks this property is going to see the same things we found."
#5 Certainty — always right after the number: "We're cash, we close on schedule, everything else stays the same."

2. DEAL SNAPSHOT — a two-column table with these rows: Property | ${R?`Agent`:`Seller`} | Contract | Where we're at (dispo) | Spoken number ([YOUR NUMBER]) | Findings | Disclosed vs. new | Their situation | Key risk

   - Do NOT put any other dollar amounts in the closer's lines.

6. IF IT'S DEAD — HOOK — exact words. If they're relationship-driven or mentioned future deals, end with a line that protects the relationship (for example, asking them to send the next one).

8. QUICK REFERENCE — a two-column table: They say | You say.

NUMBER RULE
Where we're at: Pull this amount from the DISPO DEAL BRIEF. It is dispo's ceiling—the price we must stay under—not automatically the number the closer says.
Spoken number: [YOUR NUMBER]
In the generated script, write: "Your call — below where we're at ($X)." Replace $X with the amount pulled from the brief and leave [YOUR NUMBER] unchanged.
Do not put any other dollar amounts in the closer's lines. If they counter, the closer says "Let me take that back to my team" and gets off the call. Any new number comes from the team on a separate call and must also stay below where we're at.

DISPO DEAL BRIEF
${val('dispo')}

${val('disc')}

${val('offer')}`;
